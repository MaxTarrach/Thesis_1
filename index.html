<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuMeVIS</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
  <script src="TmapData.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header class="prov">
    <h1>MuMeVIS 0.4</h1>
    <span>— analogue search across <span id="prov-samples">3</span> samples · ref: <span id="prov-ref">20,889</span> compounds · build 2026-11-15</span>
  </header>

  <main class="fig">

    <section class="panel" id="panel-a" aria-labelledby="title-a">
      <div class="panel-head">
        <h2 id="title-a"><span class="fig-letter">A</span>Chemical space</h2>
        <div class="panel-tools">
          <button type="button" class="link" id="reset-zoom" data-zoom="reset">reset</button>
        </div>
      </div>
      <div class="panel-body" id="map-body">
        <canvas id="map-canvas"></canvas>
        <svg id="map-overlay"></svg>
      </div>
    </section>

    <div class="col-right">
      <section class="panel" id="panel-b" aria-labelledby="title-b">
        <div class="panel-head">
          <h2 id="title-b"><span class="fig-letter">B</span>Features × samples</h2>
          <div class="panel-tools">
            <span id="sort-label">sort:</span>
            <div class="segmented" role="radiogroup" aria-labelledby="sort-label">
              <button type="button" role="radio" data-sort="index" aria-checked="true">index</button>
              <button type="button" role="radio" data-sort="confidence" aria-checked="false">confidence</button>
            </div>
          </div>
        </div>
        <div class="panel-body" id="matrix-body">
          <svg id="matrix"></svg>
        </div>
      </section>

      <section class="panel" id="panel-c" aria-labelledby="title-c">
        <div class="panel-head">
          <h2 id="title-c"><span class="fig-letter">C</span>Colour</h2>
        </div>
        <div class="encoding-options" role="radiogroup" aria-labelledby="title-c">
          <button type="button" class="enc-card" role="radio" data-enc="superclass" aria-checked="true">
            <span class="enc-head">
              <span class="enc-radio" aria-hidden="true"></span>
              <span class="enc-name">superclass</span>
            </span>
            <span class="enc-body" id="legend-superclass"></span>
          </button>
          <button type="button" class="enc-card" role="radio" data-enc="confidence" aria-checked="false">
            <span class="enc-head">
              <span class="enc-radio" aria-hidden="true"></span>
              <span class="enc-name">confidence</span>
            </span>
            <span class="enc-body" id="legend-confidence"></span>
          </button>
        </div>
      </section>
    </div>

  </main>

  <footer class="colophon">
    <span>[lab name] · [citation] · <a href="https://github.com/MaxTarrach/Thesis_1">github.com/MaxTarrach/Thesis_1</a> · data: MS2Query, ClassyFire</span>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
