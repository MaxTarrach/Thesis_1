<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuMeVIS</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
  <script src="TmapData.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header class="app-header">
    <h1>MuMeVIS</h1>
    <p class="subtitle">Multi-sample metabolomics: MS2Query analogues in chemical space</p>
  </header>

  <main class="views">

    <!-- Left view: chemical space -->
    <section class="panel" id="map-panel" aria-labelledby="map-title">
      <div class="panel-head">
        <div class="panel-title">
          <h2 id="map-title">Chemical space</h2>
        </div>
        <div class="panel-tools">
          <button type="button" class="link" id="reset-zoom" data-zoom="reset">reset</button>
        </div>
      </div>
      <div class="panel-body" id="map-body">
        <canvas id="map-canvas"></canvas>
        <svg id="map-overlay"></svg>
      </div>
    </section>

    <!-- Right view: feature x sample matrix -->
    <section class="panel" id="matrix-panel" aria-labelledby="matrix-title">
      <div class="panel-head">
        <div class="panel-title">
          <h2 id="matrix-title">Feature × sample matrix</h2>
        </div>
        <div class="panel-tools">
          <span class="tool-label" id="sort-label">Sort rows</span>
          <div class="segmented" role="radiogroup" aria-labelledby="sort-label">
            <button type="button" role="radio" data-sort="index" aria-checked="true">Feature index</button>
            <button type="button" role="radio" data-sort="confidence" aria-checked="false">Confidence</button>
          </div>
        </div>
      </div>
      <div class="panel-body" id="matrix-body">
        <svg id="matrix"></svg>
      </div>
    </section>

  </main>

  <!-- Shared colour encoding: each card is a legend AND the switch for that encoding -->
  <footer class="encoding-bar">
    <div class="encoding-intro">
      <span class="encoding-title" id="encoding-title">Colour by</span>
    </div>

    <div class="encoding-options" role="radiogroup" aria-labelledby="encoding-title">
      <button type="button" class="enc-card" role="radio" data-enc="superclass" aria-checked="true">
        <span class="enc-head">
          <span class="enc-radio" aria-hidden="true"></span>
          <span class="enc-name">Chemical superclass</span>
        </span>
        <span class="enc-body" id="legend-superclass"></span>
      </button>

      <button type="button" class="enc-card" role="radio" data-enc="confidence" aria-checked="false">
        <span class="enc-head">
          <span class="enc-radio" aria-hidden="true"></span>
          <span class="enc-name">Confidence in analogue</span>
        </span>
        <span class="enc-body" id="legend-confidence"></span>
      </button>
    </div>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
